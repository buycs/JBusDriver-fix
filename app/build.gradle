import java.util.regex.Pattern

apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace 'me.jbusdriver'
    compileSdk libs.versions.compileSdk.get().toInteger()
    buildToolsVersion libs.versions.buildTools.get()

    defaultConfig {
        applicationId "me.jbusdriver"
        minSdk libs.versions.minSdk.get().toInteger()
        targetSdk libs.versions.targetSdk.get().toInteger()
        versionCode 623
        versionName "1.3.7build623"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        manifestPlaceholders = [UMENG_KEY: "58e8ecaa7666134a5a001740",
                                CHANNEL  : "gayhub"]
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    androidResources {
        additionalParameters "--no-version-vectors"
    }

    signingConfigs {
        release {
            def ksFile = project.hasProperty('KEYSTORE_FILE') ? KEYSTORE_FILE : System.getenv('KEYSTORE_FILE')
            def ksPwd = project.hasProperty('KEYSTORE_PASSWORD') ? KEYSTORE_PASSWORD : System.getenv('KEYSTORE_PWD')
            def ksAlias = project.hasProperty('KEYSTORE_ALIAS') ? KEYSTORE_ALIAS : System.getenv('KEYSTORE_ALIAS')
            def ksKeyPwd = project.hasProperty('KEY_PASSWORD') ? KEY_PASSWORD : System.getenv('KEYSTORE_ALIAS_PWD')
            def ks = ksFile ? file(ksFile) : null
            // 签名信息不全就完全不配: buildTypes 用 storeFile 是否为空决定要不要引用它
            if (ks != null && ks.canRead() && [ksPwd, ksAlias, ksKeyPwd].every { it }) {
                storeFile ks
                storePassword ksPwd
                keyAlias ksAlias
                keyPassword ksKeyPwd
            } else {
                logger.warn("Keystore not configured (KEYSTORE_FILE/KEYSTORE_PASSWORD/KEYSTORE_ALIAS/KEY_PASSWORD), release builds will be unsigned.")
            }
        }
    }

    lint {
        abortOnError false
    }

    buildTypes {
        debug {
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }
        release {
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

// release 变体用 git 历史里的 tag 覆盖版本号（AGP 8 仍保留的旧变体 API，9.x 才移除）
android.applicationVariants.all { variant ->
    if (variant.buildType.name != 'release') return
    def vName = VersionName()
    def vCode = VersionCode()
    variant.outputs.all { output ->
        output.versionCodeOverride = vCode
        output.versionNameOverride = vName
        outputFileName = "JubsDriver[v${output.versionNameOverride}]_(code_${output.versionCodeOverride}).apk"
    }
}

//使用git的Tag来自动定制Version
def VersionCode() {
    def cmd = 'git rev-list master --first-parent --count'//master分支
    def out = execText(cmd)
    def code = (out.isInteger() ? out.toInteger() : android.defaultConfig.versionCode) ?: 1
    logger.quiet(cmd + " >>>> code = " + code)
    return code
}

//使用git的Tag来自动定制Version
def VersionName() {
    def fallback = (android.defaultConfig.versionName ?: "0.0.0")
    def cmd = ''' git log --tags --simplify-by-decoration --pretty="format:%d" '''
    def tags = execText(cmd).readLines()
    logger.quiet(cmd + " >>>> tags  = " + tags)
    def tagged = tags.find { it.contains("tag:") }
    if (tagged == null) {
        logger.warn("No 'tag: vX.Y.Z' found in git history, fallback to default versionName " + fallback)
        return fallback
    }
    def matcher = Pattern.compile(/tag: v[0-9a-z.-]+/).matcher(tagged)
    if (!matcher.find()) {
        logger.warn("No version tag found in '" + tagged + "', fallback to default versionName " + fallback)
        return fallback
    }
    def verName = matcher.group().replace("tag: v", "").trim()
    def code = execText('git rev-list  --all  --count').with { isInteger() ? toInteger() : 0 }
    def versionName = verName + "build" + code
    logger.quiet("git rev-list --all --count >>>> versionName  = " + versionName)
    return versionName
}

// 没有 git 时（浅克隆/无仓库）cmd.execute() 会直接抛 IOException，这里退化成空串走兜底
def execText(String cmd) {
    try {
        return cmd.execute().text.trim()
    } catch (Exception e) {
        logger.warn("git 不可用(${e.message})，版本号使用 defaultConfig 兜底")
        return ""
    }
}

dependencies {
    testImplementation libs.junit
    androidTestImplementation libs.test.runner
    androidTestImplementation libs.test.ext.junit
    androidTestImplementation libs.test.espresso.core

    // 仅本项目使用的控件，按基线规则内联
    implementation "com.xw.repo:bubbleseekbar:3.16-lite"
    implementation("com.xiaofeng.android:flowlayoutmanager:1.2.3.2")

    // leakcanary 2.x 只在 debug 生效，不再需要 1.6.2 那套 no-op + remap 写法
    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.14'

    //components
    implementation project(':libraries:library_base')
    implementation project(':libraries:library_common_bean')
    implementation project(':component_magnet')
}
