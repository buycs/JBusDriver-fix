import java.util.regex.Pattern


ext.mainApp = true //如果此module为主app module，一直以application方式编译，则启用这一行
//ext.alwaysLib = true //如果此module为基础库，一直以library方式编译，则启用这一行
apply from: rootProject.file("buildscripts/cc-settings-2-app.gradle")
//注意：最好放在build.gradle中代码的第一行


apply plugin: 'kotlin-android'
apply plugin: 'kotlin-android-extensions'
apply plugin: 'kotlin-kapt'//kapt3插件

android {
    compileSdkVersion versions.compileSdk
    buildToolsVersion versions.buildTools
    defaultConfig {
        if (project.ext.runAsApp) {
            applicationId "me.jbusdriver"
        }
        minSdkVersion 21
        targetSdkVersion versions.targetSdk
        versionCode 622
        versionName "1.3.6build622"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        flavorDimensions "github"

        // 开启multidex
        multiDexEnabled true
        manifestPlaceholders = [UMENG_KEY: "58e8ecaa7666134a5a001740",
                                CHANNEL  : "gayhub"]
    }
    //recommend
    dexOptions {
        jumboMode = true
    }

    signingConfigs {
        release {
            def ksFile = project.hasProperty('KEYSTORE_FILE') ? KEYSTORE_FILE : System.getenv('KEYSTORE_FILE')
            def ksPwd = project.hasProperty('KEYSTORE_PASSWORD') ? KEYSTORE_PASSWORD : System.getenv('KEYSTORE_PWD')
            def ksAlias = project.hasProperty('KEYSTORE_ALIAS') ? KEYSTORE_ALIAS : System.getenv('KEYSTORE_ALIAS')
            def ksKeyPwd = project.hasProperty('KEY_PASSWORD') ? KEY_PASSWORD : System.getenv('KEYSTORE_ALIAS_PWD')
            def ks = ksFile ? file(ksFile) : null
            // 签名信息不全就完全不配: buildTypes 用 storeFile 是否为空决定要不要引用它
            if (ks != null && ks.canRead() && [ksPwd, ksAlias, ksKeyPwd].every { it }) {
                storeFile ks
                storePassword ksPwd
                keyAlias ksAlias
                keyPassword ksKeyPwd
            } else {
                logger.warn("Keystore not configured (KEYSTORE_FILE/KEYSTORE_PASSWORD/KEYSTORE_ALIAS/KEY_PASSWORD), release builds will be unsigned.")
            }
        }
    }
    lintOptions {
        abortOnError false
    }
    kapt {
        useBuildCache = true
    }
    aaptOptions {
        additionalParameters "--no-version-vectors"
    }
    buildTypes {
        debug {
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }
        release {
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            android.applicationVariants.all { variant ->
                if (variant.buildType.name == 'release') {
                    logger.quiet("build release type ...")
                    def vName = VersionName()
                    def vCode = VersionCode()
                    variant.outputs.all { output ->
                        output.setVersionNameOverride(vName)
                        output.setVersionCodeOverride(vCode)
                        outputFileName = "JubsDriver[v${output.versionNameOverride}]_(code_${output.versionCodeOverride}).apk"
                    }
                }

            }

        }


    }

}

//使用git的Tag来自动定制Version
def VersionCode() {
    def cmd = 'git rev-list master --first-parent --count'//master分支
    def out = cmd.execute().text.trim()
    def code = (out.isInteger() ? out.toInteger() : android.defaultConfig.versionCode) ?: 1
    logger.quiet(cmd + " >>>> code = " + code)
    return code
}

//使用git的Tag来自动定制Version
def VersionName() {
    def fallback = (android.defaultConfig.versionName ?: "0.0.0")
    def cmd = ''' git log --tags --simplify-by-decoration --pretty="format:%d" '''
    def tags = cmd.execute().text.readLines()
    logger.quiet(cmd + " >>>> tags  = " + tags)
    def tagged = tags.find { it.contains("tag:") }
    if (tagged == null) {
        logger.warn("No 'tag: vX.Y.Z' found in git history, fallback to default versionName " + fallback)
        return fallback
    }
    def matcher = Pattern.compile(/tag: v[0-9a-z.-]+/).matcher(tagged)
    if (!matcher.find()) {
        logger.warn("No version tag found in '" + tagged + "', fallback to default versionName " + fallback)
        return fallback
    }
    def verName = matcher.group().replace("tag: v", "").trim()
    cmd = 'git rev-list  --all  --count'
    def out = cmd.execute().text.trim()
    def code = out.isInteger() ? out.toInteger() : 0

    def versionName = verName + "build" + code
    logger.quiet(cmd + " >>>> versionName  = " + versionName)
    return versionName
}


dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'com.android.support.test:runner:1.0.2'
    androidTestImplementation 'com.android.support.test.espresso:espresso-core:3.0.2'
    implementation "org.jetbrains.kotlin:kotlin-stdlib:${versions.kotlin}"
    implementation "com.xw.repo:bubbleseekbar:${versions.bubbleseekbar}-lite"
    implementation("com.xiaofeng.android:flowlayoutmanager:${versions.flowlayoutmanager}") {
        exclude group: 'com.android.support'
    }


    //    implementation(name: 'bugly_crashreport_upgrade-1.3.5', ext: 'aar')
    // 远程依赖集成方式（推荐）
//    implementation "com.tencent.bugly:crashreport_upgrade:${versions.bugly}"
    // 指定tinker依赖版本（注：应用升级1.3.5版本起，不再内置tinker）
//    implementation "com.tencent.tinker:tinker-android-lib:${versions.tinker}"

    //leak
    debugImplementation "com.squareup.leakcanary:leakcanary-android:${versions.leakcanary}"
    releaseImplementation "com.squareup.leakcanary:leakcanary-android-no-op:${versions.leakcanary}"
    // Optional, if you use support library fragments:
    debugImplementation "com.squareup.leakcanary:leakcanary-support-fragment:${versions.leakcanary}"

    //components
    addComponent "component_magnet"
    addComponent "component_plugin_manager"

    implementation "com.android.support:multidex:1.0.3" // 多dex配置
    implementation "com.wlqq.phantom:phantom-host-lib:${versions.phantom.allVersion}"
    implementation "com.wlqq.phantom:phantom-communication-lib:${versions.phantom.allVersion}"
}

configurations.all { config ->
    if (config.name.contains('UnitTest')) {
        config.resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'com.squareup.leakcanary' && details.requested.name == 'leakcanary-android') {
                details.useTarget(group: details.requested.group, name: 'leakcanary-android-no-op', version: details.requested.version)
            }
        }
    }
}

