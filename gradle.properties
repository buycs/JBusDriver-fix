## Project-wide Gradle settings.

# 代理：本机需要 127.0.0.1:7890 才能访问这些仓库时才有用，换机器请注释掉
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7890
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7890

# 签名信息（也可用同名环境变量提供，见 app 与 plugins 的 build.gradle）
KEYSTORE_PASSWORD=45127996
KEYSTORE_FILE=../jbus.jks
KEYSTORE_ALIAS=xuyujian
KEY_PASSWORD=45127996

org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true

# AGP 8 只支持 AndroidX
android.useAndroidX=true
# BRVAH / material-dialogs / immersionbar / PhotoView 等仍是 support 系构件，靠 jetifier 改写
android.enableJetifier=true
# 本项目的 R 引用大量跨模块使用（app 直接引用组件与 library_base 的资源），先保持传递式 R
android.nonTransitiveRClass=false

kotlin.code.style=official
