apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.kapt'

android {
    namespace 'me.jbusdriver.base'
    compileSdk libs.versions.compileSdk.get().toInteger()
    buildToolsVersion libs.versions.buildTools.get()

    defaultConfig {
        minSdk libs.versions.minSdk.get().toInteger()
        targetSdk libs.versions.targetSdk.get().toInteger()
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        consumerProguardFiles 'proguard-rules.pro'
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    lint {
        abortOnError false
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    testImplementation libs.junit
    androidTestImplementation libs.test.runner
    androidTestImplementation libs.test.ext.junit
    androidTestImplementation libs.test.espresso.core

    // AndroidX 基座（原 support-v4 / appcompat / design / cardview / palette / constraint）
    api libs.androidx.appcompat
    api libs.androidx.legacy.support.v4
    api libs.material
    api libs.androidx.cardview
    api libs.androidx.palette
    api libs.androidx.constraintlayout

    // 解析 / JSON / 日志
    api libs.gson
    api libs.jsoup
    api 'com.orhanobut:logger:2.2.0'

    // 仅本组件使用的视图控件：按基线规则留在各自脚本里内联，不进 catalog
    api 'com.afollestad.material-dialogs:core:0.9.6.0'
    api 'com.github.CymChad:BaseRecyclerViewAdapterHelper:2.9.44'
    api 'com.gyf.immersionbar:immersionbar:2.3.1'
    api 'com.github.chrisbanes:PhotoView:2.1.4'

    // 网络
    api libs.okhttp
    api libs.retrofit.core
    api libs.retrofit.adapter.rxjava2

    // 图片
    api(libs.glide)
    kapt libs.glide.compiler
    api libs.glide.okhttp3.integration

    // RxJava 2 族
    api libs.rxjava
    api libs.rxandroid
    api libs.rxkotlin
    api libs.rxrelay

    // 数据库：sqlbrite3 仍绑 android.arch 命名空间，迁移到 AndroidX 方案前保持原坐标
    api 'com.squareup.sqlbrite3:sqlbrite:3.2.0'
    api 'com.squareup.sqlbrite3:sqlbrite-kotlin:3.2.0'
    api 'android.arch.persistence:db-framework:1.1.1'

    // 统计
    api 'com.umeng.umsdk:common:9.3.8'
    api 'com.umeng.umsdk:asms:1.2.2'
}
