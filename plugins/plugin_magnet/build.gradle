project.ext.CurrentAppID = "me.jbusdriver.plugin.magnet"

def pTagName = project.name.replace("plugin_", "")
project.ext.deployTargets = rootProject.allprojects.findAll {
    (!it.name.startsWith("plugin_") && it.name.endsWith(pTagName)) || it.name == "app"

}
println("deployTarget :  ${deployTargets}")

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-android-extensions'
apply plugin: 'com.wlqq.phantom.plugin'

//def CurrentHostId = CurrentAppID
//println("CurrentAppID =-----> $CurrentAppID")

android {
    compileSdkVersion versions.compileSdk
    buildToolsVersion versions.buildTools

    defaultConfig {
        applicationId CurrentAppID
        minSdkVersion 21
        targetSdkVersion versions.targetSdk
        versionCode versions.plugins.magnet.version_code
        versionName versions.plugins.magnet.version_name
//        multiDexEnabled true
    }

    signingConfigs {
        release {
            def ksFile = project.hasProperty('KEYSTORE_FILE') ? KEYSTORE_FILE : System.getenv('KEYSTORE_FILE')
            def ksPwd = project.hasProperty('KEYSTORE_PASSWORD') ? KEYSTORE_PASSWORD : System.getenv('KEYSTORE_PWD')
            def ksAlias = project.hasProperty('KEYSTORE_ALIAS') ? KEYSTORE_ALIAS : System.getenv('KEYSTORE_ALIAS')
            def ksKeyPwd = project.hasProperty('KEY_PASSWORD') ? KEY_PASSWORD : System.getenv('KEYSTORE_ALIAS_PWD')
            // KEYSTORE_FILE 是相对 app 目录写的(../jbus.jks), 按 app 的目录解析才落到仓库根
            def ks = ksFile ? rootProject.project(":app").file(ksFile) : null
            if (ks != null && ks.canRead() && [ksPwd, ksAlias, ksKeyPwd].every { it }) {
                storeFile ks
                storePassword ksPwd
                keyAlias ksAlias
                keyPassword ksKeyPwd
            } else {
                logger.warn("Keystore not configured (KEYSTORE_FILE/KEYSTORE_PASSWORD/KEYSTORE_ALIAS/KEY_PASSWORD), this plugin APK will be unsigned.")
            }
        }
    }


    buildTypes {
        debug {
            // 宿主 debug 包用同一份签名, 插件保持一致才能通过 Phantom 的签名校验
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            proguardFile project.file('proguard-phantom.pro')
        }

        release {
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            proguardFile project.file('proguard-phantom.pro')
        }
    }


}

